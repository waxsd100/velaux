name: Build Japanese VelaUX Image

on:
  push:
    branches: [build/ghcr]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=latest-ja
            GITVERSION=${{ github.sha }}
            GOPROXY=https://proxy.golang.org,direct
          tags: |
            ghcr.io/${{ github.repository_owner }}/velaux:latest-ja
            ghcr.io/${{ github.repository_owner }}/velaux:latest-ja-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
